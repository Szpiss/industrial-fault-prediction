[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-fault-prediction-backend"
version = "0.1.0"
description = "Foundation API for an undergraduate industrial fault prediction project"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "pymysql[rsa]>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.16,<3", "ruff>=0.11,<1", "pip-tools>=7.4,<8", "setuptools>=75,<85"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
